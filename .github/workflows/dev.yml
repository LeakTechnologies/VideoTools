# VideoTools Dev CI — runs on every push to master
name: dev

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FFMPEG_VERSION: "8.1"
  CGO_LDFLAGS_ALLOW: "-Wl,.*"

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Cache FFmpeg
        id: cache-ffmpeg
        uses: actions/cache@v5
        with:
          path: /opt/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ vars.FFMPEG_CACHE_VERSION || 'v3' }}

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake mercurial autoconf libtool nasm yasm pkg-config \
            libx11-dev libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
            libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
            libxxf86vm-dev libvulkan-dev libxinerama-dev libasound2-dev

      - name: Build FFmpeg
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          mkdir -p /opt/ffmpeg /tmp/ffmpeg-src
          curl -L "https://ffmpeg.org/releases/ffmpeg-${FFMPEG_VERSION}.tar.xz" | tar xJ -C /tmp/ffmpeg-src --strip=1
          cd /tmp/ffmpeg-src
          ./configure --prefix=/opt/ffmpeg --enable-static --disable-shared \
            --disable-programs --disable-doc \
            --enable-gpl --enable-version3 --pkg-config-flags="--static"
          make -j$(nproc)
          make install

      - name: Build VideoTools (Linux)
        run: |
          export PKG_CONFIG_PATH=/opt/ffmpeg/lib/pkgconfig
          export CGO_CFLAGS="-I/opt/ffmpeg/include"
          export CGO_LDFLAGS="$(pkg-config --libs --static libavcodec libavformat libswscale libavutil libswresample libavfilter) -lstdc++ -lm"
          export CGO_ENABLED=1
          go build -tags native_media -o VideoTools .

      - name: Package
        run: |
          VERSION=$(head -1 VERSION 2>/dev/null || echo "dev")
          tar czf "VideoTools_${VERSION}_linux_amd64.tar.gz" VideoTools
      - uses: actions/upload-artifact@v5
        with:
          name: linux-amd64
          path: VideoTools_*.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            base-devel
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkg-config
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-diffutils
            mingw-w64-ucrt-x86_64-libwinpthread-git
            tar unzip curl

      - name: Cache FFmpeg
        id: cache-ffmpeg
        uses: actions/cache@v5
        with:
          path: C:\ffmpeg-static
          key: ffmpeg-${{ runner.os }}-${{ vars.FFMPEG_CACHE_VERSION || 'v10' }}

      - name: Build FFmpeg (static libs + static ffmpeg.exe/ffprobe.exe)
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          export PATH="/ucrt64/bin:/usr/bin:$PATH"
          export PKG_CONFIG_PATH=/c/ffmpeg-static/lib/pkgconfig
          # libdvdread + libdvdnav from source (static-only) — required by
          # FFmpeg's dvdvideo demuxer (cell-accurate DVD title playback).
          curl -L "https://downloads.videolan.org/pub/videolan/libdvdread/6.1.3/libdvdread-6.1.3.tar.bz2" | tar xj
          cd libdvdread-6.1.3
          ./configure --prefix=/c/ffmpeg-static --enable-static --disable-shared
          make -j$(nproc)
          make install
          cd ..
          curl -L "https://downloads.videolan.org/pub/videolan/libdvdnav/6.1.1/libdvdnav-6.1.1.tar.bz2" | tar xj
          cd libdvdnav-6.1.1
          ./configure --prefix=/c/ffmpeg-static --enable-static --disable-shared
          make -j$(nproc)
          make install
          cd ..
          # FFmpeg's Windows configure calls pkg-config WITHOUT --static, so the
          # dvdread entry in dvdnav's Requires.private is never expanded and the
          # dvdnav_open2 link test fails. Rewrite dvdnav.pc so -ldvdread sits in
          # Libs directly (same precedent as the x265.pc overwrite).
          echo 'prefix=/c/ffmpeg-static'           > /c/ffmpeg-static/lib/pkgconfig/dvdnav.pc
          echo 'exec_prefix=${prefix}'            >> /c/ffmpeg-static/lib/pkgconfig/dvdnav.pc
          echo 'libdir=${exec_prefix}/lib'        >> /c/ffmpeg-static/lib/pkgconfig/dvdnav.pc
          echo 'includedir=${prefix}/include'     >> /c/ffmpeg-static/lib/pkgconfig/dvdnav.pc
          echo ''                                 >> /c/ffmpeg-static/lib/pkgconfig/dvdnav.pc
          echo 'Name: libdvdnav'                  >> /c/ffmpeg-static/lib/pkgconfig/dvdnav.pc
          echo 'Description: DVD Navigation library' >> /c/ffmpeg-static/lib/pkgconfig/dvdnav.pc
          echo 'Version: 6.1.1'                   >> /c/ffmpeg-static/lib/pkgconfig/dvdnav.pc
          echo ''                                 >> /c/ffmpeg-static/lib/pkgconfig/dvdnav.pc
          echo 'Libs: -L${libdir} -ldvdnav -ldvdread' >> /c/ffmpeg-static/lib/pkgconfig/dvdnav.pc
          echo 'Cflags: -I${includedir}'          >> /c/ffmpeg-static/lib/pkgconfig/dvdnav.pc
          curl -L -o /tmp/ffmpeg.tar.bz2 "https://ffmpeg.org/releases/ffmpeg-${FFMPEG_VERSION}.tar.bz2"
          tar xjf /tmp/ffmpeg.tar.bz2 -C /tmp
          cd /tmp/ffmpeg-${FFMPEG_VERSION}
          # --extra-ldflags=-static makes ffmpeg.exe/ffprobe.exe fully
          # self-contained (no MinGW runtime DLLs) — the whole Windows
          # product ships as three static binaries with no DLL/ folder.
          #
          # ── Phase 1: diagnose pkg-config BEFORE configure ──────────────
          echo "=== PHASE 1: pkg-config diagnostics ==="
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH"
          echo "cc=$(which cc 2>/dev/null || echo NOT-FOUND)"
          echo "pkg-config=$(which pkg-config 2>/dev/null || echo NOT-FOUND)"
          echo "--- dvdnav.pc ---"
          cat /c/ffmpeg-static/lib/pkgconfig/dvdnav.pc 2>&1
          echo "--- dvdread.pc ---"
          cat /c/ffmpeg-static/lib/pkgconfig/dvdread.pc 2>&1 || echo "WARN: dvdread.pc not found"
          echo "--- pkg-config --exists tests ---"
          pkg-config --exists "dvdnav >= 6.1.1" && echo "PASS: dvdnav >= 6.1.1" || echo "FAIL: dvdnav >= 6.1.1"
          pkg-config --exists "dvdread >= 6.1.2" && echo "PASS: dvdread >= 6.1.2" || echo "FAIL: dvdread >= 6.1.2"
          echo "--- pkg-config --libs (what configure will link) ---"
          echo "dvdnav: $(pkg-config --libs dvdnav 2>&1)"
          echo "dvdread: $(pkg-config --libs dvdread 2>&1)"
          echo "--- pkg-config --cflags (what configure will compile with) ---"
          echo "dvdnav: $(pkg-config --cflags dvdnav 2>&1)"
          echo "dvdread: $(pkg-config --cflags dvdread 2>&1)"
          echo "--- static archive files ---"
          ls -la /c/ffmpeg-static/lib/libdvd* 2>&1
          echo "=== END PHASE 1 ==="
          #
          # ── Phase 2: configure (save full output, NOT piped) ───────────
          echo "=== PHASE 2: FFmpeg configure ==="
          ./configure --prefix=/c/ffmpeg-static --enable-static --disable-shared \
            --disable-doc --enable-gpl --enable-version3 \
            --enable-libdvdnav --enable-libdvdread \
            --extra-ldflags="-static" 2>&1 | tee /tmp/ffmpeg-configure.log
          RC=${PIPESTATUS[0]}
          echo "=== configure exit code: $RC ==="
          if [ $RC -ne 0 ]; then
            echo "=== configure FAILED — searching for dvd/dvdnav/dvdread errors ==="
            grep -i "dvd\|dvdnav\|dvdread" /tmp/ffmpeg-configure.log || true
            echo "=== config.log last 80 lines ==="
            tail -80 ffbuild/config.log 2>/dev/null
            exit $RC
          fi
          #
          # ── Phase 3: verify configure enabled dvdvideo ─────────────────
          echo "=== PHASE 3: post-configure verification ==="
          echo "--- config.mak dvdvideo/dvdnav/dvdread flags ---"
          grep -iE "dvdvideo|dvdnav|dvdread" ffbuild/config.mak 2>/dev/null || echo "WARN: no dvd entries in config.mak"
          echo "--- configure log dvd/dvdnav/dvdread lines ---"
          grep -iE "dvd|dvdnav|dvdread" /tmp/ffmpeg-configure.log 2>/dev/null | grep -v "^#" | head -30 || echo "WARN: no dvd lines in configure log"
          echo "--- config.log require_pkg_config results ---"
          grep -i "require_pkg_config\|dvdnav_open2\|DVDOpen2\|dvd_reader" ffbuild/config.log 2>/dev/null | tail -20 || echo "WARN: no pkg-config test results in config.log"
          echo "--- compile test objects exist? ---"
          ls -la libavformat/dvdvideo* 2>/dev/null || echo "WARN: dvdvideo source not found in libavformat"
          echo "=== END PHASE 3 ==="
          #
          make -j$(nproc)
          make install
          #
          # ── Phase 4: final verification ────────────────────────────────
          echo "=== PHASE 4: post-build verification ==="
          echo "--- dvdvideo object file ---"
          ls -la libavformat/dvdvideodec.o 2>/dev/null || echo "WARN: dvdvideodec.o not found"
          echo "--- ffmpeg -buildconf (dvdnav/dvdread flags) ---"
          /c/ffmpeg-static/bin/ffmpeg.exe -buildconf 2>&1 | grep -i dvd || echo "WARN: no dvd flags in buildconf"
          echo "--- ffmpeg -h demuxer=dvdvideo ---"
          /c/ffmpeg-static/bin/ffmpeg.exe -h demuxer=dvdvideo 2>&1 | head -5
          echo "=== END PHASE 4 ==="
          /c/ffmpeg-static/bin/ffmpeg.exe -h demuxer=dvdvideo 2>&1 | grep -q "DVD video demuxer" \
            || { echo "FATAL: dvdvideo demuxer not enabled after FFmpeg build"; exit 1; }

      - name: Verify dvdvideo demuxer
        shell: msys2 {0}
        run: |
          if /c/ffmpeg-static/bin/ffmpeg.exe -h demuxer=dvdvideo 2>&1 | grep -q "DVD video demuxer"; then
            echo "OK: dvdvideo demuxer present"
          else
            echo "ERROR: dvdvideo demuxer missing"
            exit 1
          fi

      - name: Build VideoTools (Windows)
        shell: msys2 {0}
        run: |
          export GOROOT=$(ls -d /c/hostedtoolcache/windows/go/*/x64 2>/dev/null | tail -1)
          export PATH="/ucrt64/bin:/usr/bin:${GOROOT}/bin:${PATH}"
          export CGO_CFLAGS="-I/c/ffmpeg-static/include -g0"
          export PKG_CONFIG_PATH=/c/ffmpeg-static/lib/pkgconfig
          # Promote static archives into the ffmpeg prefix (first -L dir) so ld
          # picks lib<name>.a over MSYS2's lib<name>.dll.a — otherwise the exe
          # picks up runtime deps on libbz2-1.dll, zlib1.dll, libstdc++-6.dll etc.
          for lib in bz2 z lzma iconv stdc++; do
            src="/ucrt64/lib/lib${lib}.a"
            [ -f "$src" ] && cp -n "$src" /c/ffmpeg-static/lib/ && echo "promoted lib${lib}.a"
          done
          FFLIBS="$(pkg-config --libs --static libavcodec libavformat libswscale libavutil libswresample libavfilter)"
          if [ -z "$FFLIBS" ]; then echo "ERROR: pkg-config produced no FFmpeg link flags"; exit 1; fi
          FFLIBS="${FFLIBS//-lsupc++/}"
          export CGO_LDFLAGS="$FFLIBS -lbcrypt -lSecur32 -lcrypt32 -lncrypt -lWs2_32 -lmfplat -lstrmiids -lavrt -lole32 -luser32 -loleaut32 -lgdi32 -lpsapi -static-libgcc -static-libstdc++ -Wl,-Bstatic,-lpthread -Wl,-Bdynamic"
          export CGO_ENABLED=1
          export CC=$(cygpath -m /ucrt64/bin/gcc)
          windres scripts/videotools.rc -O coff -o videotools_windows_amd64.syso || true
          go build -tags native_media -o VideoTools.exe .

      - name: Verify no MinGW runtime DLL dependencies
        shell: msys2 {0}
        run: |
          FAIL=0
          for exe in VideoTools.exe /c/ffmpeg-static/bin/ffmpeg.exe /c/ffmpeg-static/bin/ffprobe.exe; do
            echo "--- $exe DLL dependencies ---"
            objdump -p "$exe" | grep -i 'DLL Name'
            BAD=$(objdump -p "$exe" | grep -i 'DLL Name' | grep -Ei 'lib(bz2|lzma|iconv|stdc\+\+|winpthread|gcc)|zlib1' || true)
            if [ -n "$BAD" ]; then
              echo "ERROR: $exe depends on non-system DLLs:"
              echo "$BAD"
              FAIL=1
            fi
          done
          exit $FAIL

      - name: Package
        shell: pwsh
        run: |
          Copy-Item C:\ffmpeg-static\bin\ffmpeg.exe,C:\ffmpeg-static\bin\ffprobe.exe .
          $version = if (Test-Path VERSION) { Get-Content VERSION -Raw | ForEach-Object { $_.Trim() } } else { "dev" }
          Compress-Archive -Path VideoTools.exe,ffmpeg.exe,ffprobe.exe -DestinationPath "VideoTools_${version}_windows_amd64.zip"
      - uses: actions/upload-artifact@v5
        with:
          name: windows-amd64
          path: VideoTools_*.zip
